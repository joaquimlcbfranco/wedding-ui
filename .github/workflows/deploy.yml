name: Deploy Angular App to GitHub Pages

on:
  push:
    branches: [ main ] # Change to 'master' if your main branch is master

# 1. Grant GitHub Actions permission to write back to the repository
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js (v22 required for Angular 19+)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build -- --configuration production --base-href "/wedding-ui/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/wedding-frontend/browser
